[package]
name = "keymesh-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Browser bridge for the Keymesh core (synthetic demo only, not production ready)"
license = "UNLICENSED"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core without filesystem, process runner or CLI.
keymesh = { path = "../..", default-features = false }
# Must match the installed wasm-bindgen-cli exactly.
wasm-bindgen = "=0.2.129"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"
data-encoding = "2"
sha2 = "0.10"
subtle = "2"

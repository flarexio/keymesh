<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Keymesh</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- No third-party origins. 'wasm-unsafe-eval' is required to compile the core's WebAssembly (page and KDF worker). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <!-- Installable app (PWA): same-origin manifest and icons only. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Keymesh">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f4f0">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141517">
  <!-- Saved language/appearance applied before first paint (same-origin file, not inline). -->
  <script src="preferences-boot.js"></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>

name: ci

on:
  push:
    branches: [main, "feature/**"]
    # Releases: a vMAJOR.MINOR.PATCH tag is the only thing that publishes.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older run. Every other run (main,
# branches, tags, workflow_dispatch) gets a group of its own, so it is never
# cancelled, not even as a pending run behind another run of the same ref.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || format('ci-{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # build=false only when every changed path is **/*.md, docs/** or LICENSE
  # (scripts/ci-changes.sh). Tags and workflow_dispatch always build. Then
  # rust, web and lint are skipped (a skipped job passes a required check), and
  # the image matrix still runs so its required "image (<platform>)" checks
  # report success, with every step gated on build.
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: sh scripts/ci-changes.sh

  rust:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      # Caches are written only by pushes to branches; pull requests and tags
      # restore them (pull requests read their base branch's) but never save.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo clippy -p keymesh --lib --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - run: cargo clippy -p keymesh-wasm --target wasm32-unknown-unknown -- -D warnings

  # This job builds the bundle a release publishes, so on a tag it starts from
  # clean: no Rust cache and no npm cache are restored.
  web:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-15
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      # WASM build and the wasm-bindgen-cli binary (~/.cargo/bin); see `rust`.
      - if: github.ref_type != 'tag'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' && github.ref_type == 'branch' }}
      - name: Install wasm-bindgen-cli (must match the crate pin)
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ github.ref_type != 'tag' && 'npm' || '' }}
          package-manager-cache: ${{ github.ref_type != 'tag' }}
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Hand the exact bundle E2E ran against to the image job, with its ledger.
      - name: Asset ledger of the tested bundle
        run: node ../../scripts/asset-ledger.mjs dist/web/browser --revision "$GITHUB_SHA" --out "$RUNNER_TEMP/asset-ledger.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist/web/browser
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist-ledger
          path: ${{ runner.temp }}/asset-ledger.json
          if-no-files-found: error
          retention-days: 14

  # Lints every tracked shell script and the workflows (actionlint also runs
  # shellcheck on each run: block). Any finding fails the job, and the image
  # jobs need it, so nothing is built or published unless lint passes.
  lint:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      # sha256 of actionlint_1.7.12_linux_amd64.tar.gz (release checksums file).
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck (runner's preinstalled version)
        run: |
          shellcheck --version
          git ls-files -z '*.sh' | xargs -0 shellcheck -x
      - name: Install actionlint (pinned release, sha256-verified)
        run: |
          f=actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/$f" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$f"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: actionlint (with shellcheck)
        run: |
          actionlint -version
          actionlint -color -shellcheck "$(command -v shellcheck)"

  # Multi-arch keymesh-web image, built from the bundle E2E tested. Each platform
  # builds on its own native runner (COPY-only Dockerfile); `manifest` joins them
  # into one index. Pushing and attesting happen only for a vMAJOR.MINOR.PATCH
  # tag in flarexio/keymesh (pushed, or re-run with workflow_dispatch on the
  # tag; deploy/ci-release.sh), and only when the DOCKERHUB_REPOSITORY variable
  # and the REGISTRY_USERNAME/REGISTRY_PASSWORD (flarexio organization) secrets
  # are set. Otherwise (main, branches, pull requests, forks, missing settings)
  # both legs build without logging in or pushing, and `manifest` is skipped.
  # On a docs-only change the matrix still runs (so both required checks
  # report) but every step is skipped.
  image:
    name: image (${{ matrix.platform }})
    needs: [changes, rust, web, lint]
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.changes.outputs.build != 'true' || (needs.rust.result == 'success' && needs.web.result == 'success' && needs.lint.result == 'success')) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, arch: amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    env:
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
      HAS_CREDENTIALS: ${{ secrets.REGISTRY_USERNAME != '' && secrets.REGISTRY_PASSWORD != '' }}
      BUILD: ${{ needs.changes.outputs.build }}
    steps:
      - name: Docs-only change
        if: env.BUILD != 'true'
        run: echo "Only documentation changed; nothing to build (see the changes job)."
      - if: env.BUILD == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: env.BUILD == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # The publishing job restores no caches (cache-poisoning hygiene).
          package-manager-cache: false
      - if: env.BUILD == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: apps/web/dist/web/browser
      - if: env.BUILD == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist-ledger
          path: ${{ runner.temp }}/tested
      - name: Check the bundle is the one E2E tested
        if: env.BUILD == 'true'
        run: |
          node scripts/asset-ledger.mjs apps/web/dist/web/browser --revision "$GITHUB_SHA" --out "$RUNNER_TEMP/bundle-ledger.json"
          node scripts/asset-ledger.mjs --compare "$RUNNER_TEMP/tested/asset-ledger.json" "$RUNNER_TEMP/bundle-ledger.json"
      - name: Decide push and created time
        id: meta
        if: env.BUILD == 'true'
        run: |
          sh deploy/ci-release.sh meta
          publish=$(sed -n 's/^publish=//p' "$GITHUB_OUTPUT" | tail -n 1)
          reason=$(sed -n 's/^reason=//p' "$GITHUB_OUTPUT" | tail -n 1)
          if [ "$publish" = true ]; then
            image=docker.io/$DOCKERHUB_REPOSITORY
            outputs="type=image,name=$image,push-by-digest=true,name-canonical=true,push=true"
          else
            image=keymesh-web
            outputs=
            echo "::notice title=keymesh-web ${{ matrix.arch }} image not pushed::$reason"
          fi
          {
            echo "image=$image"
            echo "outputs=$outputs"
            echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - if: env.BUILD == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.meta.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - id: build
        if: env.BUILD == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/web
          file: deploy/web.Dockerfile
          platforms: ${{ matrix.platform }}
          # Publishing pushes this platform's manifest by digest only (no tags);
          # `manifest` tags the joined index. Otherwise this is a build check.
          outputs: ${{ steps.meta.outputs.outputs }}
          provenance: false
          sbom: false
          build-args: KEYMESH_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.created }}
      - name: Record digest
        if: steps.meta.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '%s' "$DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}' || { echo "::error::no pushed digest"; exit 1; }
          mkdir -p "$RUNNER_TEMP/digest"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digest/digest"
          printf '%s\n' "${{ matrix.platform }}" > "$RUNNER_TEMP/digest/platform"
          cp "$RUNNER_TEMP/bundle-ledger.json" "$RUNNER_TEMP/digest/bundle-ledger.json"
      - if: steps.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest
          if-no-files-found: error
          retention-days: 14
      - name: Leg summary
        if: env.BUILD == 'true'
        env:
          PUBLISH: ${{ steps.meta.outputs.publish }}
          REASON: ${{ steps.meta.outputs.reason }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### keymesh-web ${{ matrix.platform }} (${{ matrix.runner }})"
            if [ "$PUBLISH" = true ]; then echo "Pushed by digest: \`$DIGEST\`"; else echo "Not pushed: $REASON"; fi
            echo
            echo "| Bundle file | sha256 | bytes |"
            echo "|---|---|---|"
            jq -r '.files | to_entries[]
              | select(.key == "wasm/keymesh_wasm_bg.wasm" or .key == "ngsw.json" or (.key | test("^main-[^/]*\\.js$")))
              | "| `\(.key)` | `\(.value.sha256)` | \(.value.bytes) |"' "$RUNNER_TEMP/bundle-ledger.json"
          } >> "$GITHUB_STEP_SUMMARY"

  # Joins the per-platform digests of a release into one index tagged
  # <version>, sha-<sha> and (for the highest release) latest, checks it, and
  # attests the index digest. Runs only when the image legs published, and only
  # after rust, web and lint passed in this same run (no caches here either).
  manifest:
    needs: [changes, rust, web, lint, image]
    if: needs.image.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      IMAGE: ${{ needs.image.outputs.image }}
      VERSION: ${{ needs.image.outputs.version }}
      DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: ${{ runner.temp }}/digests
      - name: Collect digests and check both legs used the same bundle
        id: legs
        run: |
          d=$RUNNER_TEMP/digests
          for arch in amd64 arm64; do
            [ "$(cat "$d/digests-$arch/platform")" = "linux/$arch" ] || { echo "::error::digests-$arch has the wrong platform"; exit 1; }
            dg=$(cat "$d/digests-$arch/digest")
            printf '%s' "$dg" | grep -Eqx 'sha256:[0-9a-f]{64}' || { echo "::error::bad digest for $arch"; exit 1; }
            echo "$arch=$dg" >> "$GITHUB_OUTPUT"
          done
          node scripts/asset-ledger.mjs --compare "$d/digests-amd64/bundle-ledger.json" "$d/digests-arm64/bundle-ledger.json"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Is this the highest release (moves latest)?
        id: latest
        run: |
          latest=$(git ls-remote --tags --refs "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" 'refs/tags/v*' | sh deploy/ci-release.sh latest "$VERSION")
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "release $VERSION; latest=$latest"
          if [ "$latest" != true ]; then echo "::notice title=latest not moved::$VERSION is not the highest release tag"; fi
      - name: Create and check the index
        id: index
        env:
          AMD64: ${{ steps.legs.outputs.amd64 }}
          ARM64: ${{ steps.legs.outputs.arm64 }}
          LATEST: ${{ steps.latest.outputs.latest }}
        run: sh deploy/ci-manifest.sh
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # Docker Hub must be named index.docker.io for push-to-registry.
          subject-name: index.docker.io/${{ env.DOCKERHUB_REPOSITORY }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Summary and asset ledger
        env:
          DIGEST: ${{ steps.index.outputs.digest }}
          TAGS: ${{ steps.index.outputs.tags }}
          AMD64: ${{ steps.legs.outputs.amd64 }}
          ARM64: ${{ steps.legs.outputs.arm64 }}
        run: |
          jq --arg image "$IMAGE" --arg digest "$DIGEST" --arg tags "$TAGS" \
            --arg amd64 "$AMD64" --arg arm64 "$ARM64" --arg version "$VERSION" \
            '{revision, version: $version, image: {name: $image, index_digest: $digest, platforms: {"linux/amd64": $amd64, "linux/arm64": $arm64}, tags: ($tags | split("\n") | map(select(length > 0)))}, files}' \
            "$RUNNER_TEMP/digests/digests-amd64/bundle-ledger.json" > "$RUNNER_TEMP/asset-ledger.json"
          {
            echo "## keymesh-web image"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Release | \`$VERSION\` (\`$GITHUB_REF\`) |"
            echo "| Revision | \`$GITHUB_SHA\` |"
            echo "| Index digest | \`$IMAGE@$DIGEST\` |"
            echo "| linux/amd64 | \`$AMD64\` |"
            echo "| linux/arm64 | \`$ARM64\` |"
            printf '%s\n' "$TAGS" | while IFS= read -r tag; do
              if [ -n "$tag" ]; then echo "| Tag | \`$tag\` |"; fi
            done
            echo
            echo "| Bundle file (same in both platforms) | sha256 | bytes |"
            echo "|---|---|---|"
            jq -r '.files | to_entries[]
              | select(.key == "wasm/keymesh_wasm_bg.wasm" or .key == "ngsw.json" or (.key | test("^main-[^/]*\\.js$")))
              | "| `\(.key)` | `\(.value.sha256)` | \(.value.bytes) |"' "$RUNNER_TEMP/asset-ledger.json"
            echo
            echo "Full ledger ($(jq '.files | length' "$RUNNER_TEMP/asset-ledger.json") files): artifact \`asset-ledger\`."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asset-ledger
          path: ${{ runner.temp }}/asset-ledger.json
          if-no-files-found: error
          retention-days: 90

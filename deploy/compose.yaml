# Keymesh web container (experimental; synthetic data only).
# Keymesh ships only this service: plain HTTP on 127.0.0.1:4320 (loopback only),
# with host networking, so Docker publishes no ports and adds no NAT or iptables
# rules. TLS, certificates and routing for keymesh.cloud belong to the host's
# shared reverse proxy, which is not part of this repository. See deploy/README.md.
name: keymesh

services:
  web:
    # Local fallback: `up --build` builds keymesh-web:local from the current dist.
    # CI-built images: deploy/pull-deploy.sh sets KEYMESH_WEB_IMAGE to the
    # Docker Hub image pinned by digest and recreates web with --no-build.
    build:
      context: ../apps/web
      dockerfile: ../../deploy/web.Dockerfile
      args:
        KEYMESH_REVISION: ${KEYMESH_REVISION:-unknown}
    image: ${KEYMESH_WEB_IMAGE:-keymesh-web:local}
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    network_mode: host
    user: "1000:1000"
    cap_drop: [ALL]
    # A static file server: bounded memory and processes (it needs well under
    # 128 MiB and one process; the limits only stop a runaway, never normal use).
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    environment:
      HOST: 127.0.0.1
      PORT: "4320"
